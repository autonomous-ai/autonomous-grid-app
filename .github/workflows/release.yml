name: release

# Tag-triggered release for the Grid desktop app (Flutter).
#
# Pushing a tag like `v0.1.2` builds the app on each target, bundles the `grid`
# CLI sidecar (Nuitka onefile, compiled from the grid CLI source by grid-app's own
# scripts/cli/build_sidecar.{sh,ps1}), and publishes a DRAFT GitHub Release:
#
#   Grid-<ver>-macOS-Apple-Silicon.dmg   (signed + notarized)
#   Grid-<ver>-macOS-Intel.dmg           (signed + notarized; consumer-only, no engine)
#   Grid-<ver>-Windows-x64.zip           (unsigned; SmartScreen may warn)
#
#   git tag v0.1.2 && git push origin v0.1.2
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   CLI_REPO_TOKEN              PAT with read access to autonomous-ai/autonomous-grid
#   APPLE_CERTIFICATE_BASE64    base64 of the "Developer ID Application" .p12
#   APPLE_CERTIFICATE_PASSWORD  password used when exporting that .p12
#   APPLE_SIGNING_IDENTITY      "Developer ID Application: <Name> (TEAMID)"
#   APPLE_ID                    Apple ID email          (notarization)
#   APPLE_TEAM_ID               Apple Developer Team ID (notarization)
#   APPLE_APP_PASSWORD          app-specific password   (notarization)
# GITHUB_TOKEN is provided automatically and needs `contents: write` (below).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# grid CLI release the sidecar is built from. Pinned to a published release (never
# `main`) so every grid-app release compiles a known-good, reproducible CLI. Bump this
# one line to ship a newer CLI: https://github.com/autonomous-ai/autonomous-grid/releases
env:
  CLI_VERSION: v0.1.5

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # Apple Silicon, native arm64 build
            arch: arm64
            label: macOS-Apple-Silicon
          - platform: macos-latest      # Intel x86_64 build, compiled under Rosetta 2
            arch: x64                    # on the same arm64 runner (no free Intel image
            label: macOS-Intel           # since macos-13 retired). Consumer-only.
          - platform: windows-latest
            arch: x64
            label: Windows-x64

    runs-on: ${{ matrix.platform }}
    # The Nuitka sidecar build is slow (macOS ~45m; Windows >56m), and macOS adds
    # notarization wait on top — 60m timed Windows out mid-compile. 120m is safe.
    timeout-minutes: 120

    steps:
      - name: Checkout app
        uses: actions/checkout@v5
        with:
          path: grid-app

      # Sidecar source, pinned to the CLI_VERSION release (not main) for reproducible
      # builds. Cloned as a sibling of grid-app so the scripts' default CLI path
      # ("$APP_ROOT/../autonomous-grid-cli") resolves unchanged.
      - name: Checkout grid CLI (sidecar source)
        uses: actions/checkout@v5
        with:
          repository: autonomous-ai/autonomous-grid
          ref: ${{ env.CLI_VERSION }}
          token: ${{ secrets.CLI_REPO_TOKEN }}
          path: autonomous-grid-cli

      - name: Resolve version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Stamp version from tag
        shell: bash
        working-directory: grid-app
        run: scripts/build/set-version.sh "${GITHUB_REF_NAME}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # architecture pins the interpreter's arch to the matrix arch. On the Intel
      # macOS job this installs an x86_64 python (runs under Rosetta 2 on the arm64
      # runner); Nuitka then emits a native x86_64 sidecar. arm64/Windows use their
      # native arch.
      - name: Set up Python (sidecar build)
        id: setup_python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: ${{ matrix.arch }}

      - name: Flutter dependencies
        shell: bash
        working-directory: grid-app
        run: flutter pub get

      # ───────────────────────── macOS ─────────────────────────
      - name: Build grid sidecar (macOS)
        if: runner.os == 'macOS'
        working-directory: grid-app
        # grid-app's own driver compiles the cloned CLI source -> autonomous-grid-cli/dist/grid.
        # Nuitka can't cross-compile, so the sidecar's arch follows the build python's arch:
        # setup-python installed an arm64 python for the Apple Silicon job and an x86_64
        # (Rosetta 2) python for the Intel job, so each job emits a native binary for its
        # target — the Intel slice is built under Rosetta on the same arm64 runner (GitHub
        # retired the free macos-13 Intel image; this avoids a paid `-large` runner).
        # TODO(release): the Intel build runs Nuitka under Rosetta (~1.5-2x slower); watch
        # the 120m timeout on the first tagged release and bump if it gets close.
        # Signed (Developer ID, hardened runtime) + notarized downstream, so it isn't
        # SIGKILL'd like an ad-hoc build.
        env:
          GRID_BUILD_PYTHON: ${{ steps.setup_python.outputs.python-path }}
        run: bash scripts/cli/build_sidecar.sh "$GITHUB_WORKSPACE/autonomous-grid-cli"

      - name: Build macOS app + inject sidecar
        if: runner.os == 'macOS'
        working-directory: grid-app
        run: |
          set -euxo pipefail
          flutter config --enable-macos-desktop
          flutter build macos --release
          APP="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n1)"
          [ -n "$APP" ] || { echo "built .app not found" >&2; exit 1; }
          cp ../autonomous-grid-cli/dist/grid "$APP/Contents/Resources/grid"
          chmod +x "$APP/Contents/Resources/grid"

      - name: Set up signing + notarization
        if: runner.os == 'macOS'
        working-directory: grid-app
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          NOTARY_PROFILE: grid-notary
        run: scripts/ci/setup_macos_signing.sh

      # Reuses scripts/notarize_macos.sh: signs the sidecar + app with the
      # Developer ID (hardened runtime), notarizes + staples, builds the .dmg
      # via package_dmg_macos.sh, then notarizes + staples the dmg too.
      - name: Sign, notarize, package DMG
        if: runner.os == 'macOS'
        working-directory: grid-app
        env:
          DEV_ID: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_PROFILE: grid-notary
          OUT_DMG: ${{ github.workspace }}/grid-app/dist/Grid-${{ env.VERSION }}-${{ matrix.label }}.dmg
        run: |
          mkdir -p dist
          scripts/notarize_macos.sh

      # ───────────────────────── Windows ─────────────────────────
      - name: Build grid sidecar (Windows)
        if: runner.os == 'Windows'
        working-directory: grid-app
        # grid-app's own driver compiles the cloned CLI source -> autonomous-grid-cli\dist\grid.exe.
        run: powershell -ExecutionPolicy Bypass -File scripts\cli\build_sidecar.ps1 -CliSrc "${{ github.workspace }}\autonomous-grid-cli"

      - name: Build Windows app + package zip
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: grid-app
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release
          powershell -ExecutionPolicy Bypass -File scripts\package_windows.ps1 `
            -Sidecar ..\autonomous-grid-cli\dist\grid.exe `
            -OutZip  "${{ github.workspace }}\grid-app\dist\Grid-${{ env.VERSION }}-Windows-x64.zip"

      # ───────────────────────── Publish ─────────────────────────
      - name: Publish to GitHub Release (draft)
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: Grid ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          # One glob: each runner's dist/ holds only its own artifact (mac -> .dmg,
          # Windows -> .zip), so this stays strict without cross-platform misses.
          fail_on_unmatched_files: true
          files: grid-app/dist/*
