name: release

# Tag-triggered release for the Grid desktop app (Flutter).
#
# Pushing a tag like `v0.1.2` builds the app on each target, bundles the `grid`
# CLI sidecar (Nuitka standalone/onedir, compiled from the grid CLI source by grid-app's
# own scripts/cli/build_sidecar.{sh,ps1}), and publishes a DRAFT GitHub Release:
#
#   Grid-<ver>-macOS-Apple-Silicon.dmg   (signed + notarized)
#
# Windows builds are disabled for now (deferred) — only macOS Apple Silicon is
# produced. See the commented-out `windows-latest` matrix entry below to re-enable.
#
#   git tag v0.1.2 && git push origin v0.1.2
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   CLI_REPO_TOKEN              PAT with read access to autonomous-ai/autonomous-grid
#   APPLE_CERTIFICATE_BASE64    base64 of the "Developer ID Application" .p12
#   APPLE_CERTIFICATE_PASSWORD  password used when exporting that .p12
#   APPLE_SIGNING_IDENTITY      "Developer ID Application: <Name> (TEAMID)"
#   APPLE_ID                    Apple ID email          (notarization)
#   APPLE_TEAM_ID               Apple Developer Team ID (notarization)
#   APPLE_APP_PASSWORD          app-specific password   (notarization)
# GITHUB_TOKEN is provided automatically and needs `contents: write` (below).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# grid CLI release the sidecar is built from. Pinned to a published release (never
# `main`) so every grid-app release compiles a known-good, reproducible CLI. Bump this
# one line to ship a newer CLI: https://github.com/autonomous-ai/autonomous-grid/releases
env:
  CLI_VERSION: v0.1.12
  # PUBLIC repo that hosts client-facing release binaries (.dmg) + the Sparkle
  # appcast. Kept separate from this private source repo so the auto-update feed
  # is reachable without auth (a private repo's release assets 404 for anyone
  # without repo access — including the client's Sparkle). Must be a public repo
  # with at least one commit; CI cross-publishes to it with GRID_DOWNLOADS_TOKEN.
  DOWNLOADS_REPO: autonomous-ecm/autonomous-grid-app-downloads

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # Apple Silicon, native arm64 build
            arch: arm64
            label: macOS-Apple-Silicon
          # Windows build disabled for now — deferred until Windows code-signing +
          # a WinSparkle key exist. Uncomment to re-enable; the `if: runner.os ==
          # 'Windows'` build steps below stay in place, dormant, ready for it.
          # - platform: windows-latest
          #   arch: x64
          #   label: Windows-x64

    runs-on: ${{ matrix.platform }}
    # The Nuitka sidecar build is slow (macOS ~45m; Windows >56m), and macOS adds
    # notarization wait on top — 60m timed Windows out mid-compile. 120m is safe.
    timeout-minutes: 120

    steps:
      - name: Checkout app
        uses: actions/checkout@v5
        with:
          path: grid-app

      # Sidecar source, pinned to the CLI_VERSION release (not main) for reproducible
      # builds. Cloned as a sibling of grid-app so the scripts' default CLI path
      # ("$APP_ROOT/../autonomous-grid-cli") resolves unchanged.
      - name: Checkout grid CLI (sidecar source)
        uses: actions/checkout@v5
        with:
          repository: autonomous-ai/autonomous-grid
          ref: ${{ env.CLI_VERSION }}
          token: ${{ secrets.CLI_REPO_TOKEN }}
          path: autonomous-grid-cli

      - name: Resolve version
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          # Monotonic CFBundleVersion for Sparkle's "is there a newer build?"
          # comparison: 0.2.0 -> 2000, 0.3.0 -> 3000, 1.0.0 -> 1000000. Without a
          # per-release build number Flutter reuses the same CFBundleVersion and
          # Sparkle never offers the update.
          IFS=. read -r MA MI PA <<< "${V%%+*}"
          echo "BUILD=$((10#$MA * 1000000 + 10#$MI * 1000 + 10#$PA))" >> "$GITHUB_ENV"

      - name: Stamp version from tag
        shell: bash
        working-directory: grid-app
        run: scripts/build/set-version.sh "${VERSION}+${BUILD}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Python (sidecar build)
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Flutter dependencies
        shell: bash
        working-directory: grid-app
        run: flutter pub get

      # ───────────────────────── macOS ─────────────────────────
      - name: Build grid sidecar (macOS)
        if: runner.os == 'macOS'
        working-directory: grid-app
        # grid-app's own driver compiles the cloned CLI source -> autonomous-grid-cli/dist/grid.dist/
        # (Nuitka standalone/onedir), native arm64 (Nuitka can't cross-compile, and GitHub-hosted
        # macOS runners are Apple Silicon only — no Intel image since macos-13 was retired). Onedir,
        # not onefile: the folder is signed (Developer ID, hardened runtime) + notarized downstream,
        # so nothing is extracted+SIGKILL'd at runtime under download quarantine.
        run: bash scripts/cli/build_sidecar.sh "$GITHUB_WORKSPACE/autonomous-grid-cli"

      - name: Build macOS app + inject sidecar
        if: runner.os == 'macOS'
        working-directory: grid-app
        run: |
          set -euxo pipefail
          flutter config --enable-macos-desktop
          # Bake the Sparkle appcast feed the app polls at runtime. Stable public
          # URL on the downloads repo: GitHub always serves the newest *published*
          # (non-draft) release's appcast.xml here.
          flutter build macos --release \
            --dart-define=GRID_APPCAST_URL="https://github.com/${{ env.DOWNLOADS_REPO }}/releases/latest/download/appcast.xml"
          APP="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n1)"
          [ -n "$APP" ] || { echo "built .app not found" >&2; exit 1; }
          # onedir sidecar: inject the whole standalone folder (entry at Resources/grid/grid)
          rm -rf "$APP/Contents/Resources/grid"
          cp -R ../autonomous-grid-cli/dist/grid.dist "$APP/Contents/Resources/grid"
          chmod +x "$APP/Contents/Resources/grid/grid"

      - name: Set up signing + notarization
        if: runner.os == 'macOS'
        working-directory: grid-app
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          NOTARY_PROFILE: grid-notary
        run: scripts/ci/setup_macos_signing.sh

      # Reuses scripts/notarize_macos.sh: signs the sidecar + app with the
      # Developer ID (hardened runtime), notarizes + staples, builds the .dmg
      # via package_dmg_macos.sh, then notarizes + staples the dmg too.
      - name: Sign, notarize, package DMG
        if: runner.os == 'macOS'
        working-directory: grid-app
        env:
          DEV_ID: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_PROFILE: grid-notary
          OUT_DMG: ${{ github.workspace }}/grid-app/dist/Grid-${{ env.VERSION }}-${{ matrix.label }}.dmg
        run: |
          mkdir -p dist
          scripts/notarize_macos.sh

      # Sign the DMG with the Sparkle EdDSA key and write dist/appcast.xml next to
      # it (both get uploaded by the publish step). Skipped with a warning until
      # the SPARKLE_ED_PRIVATE_KEY secret is provisioned, so releases still build.
      - name: Generate Sparkle appcast (macOS)
        if: runner.os == 'macOS'
        working-directory: grid-app
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          DMG: ${{ github.workspace }}/grid-app/dist/Grid-${{ env.VERSION }}-${{ matrix.label }}.dmg
          DOWNLOAD_URL: https://github.com/${{ env.DOWNLOADS_REPO }}/releases/download/${{ github.ref_name }}/Grid-${{ env.VERSION }}-${{ matrix.label }}.dmg
          SHORT_VERSION: ${{ env.VERSION }}
          BUNDLE_VERSION: ${{ env.BUILD }}
          APPCAST_OUT: ${{ github.workspace }}/grid-app/dist/appcast.xml
        run: bash scripts/ci/generate_appcast_macos.sh

      # ───────────────────────── Windows ─────────────────────────
      - name: Build grid sidecar (Windows)
        if: runner.os == 'Windows'
        working-directory: grid-app
        # grid-app's own driver compiles the cloned CLI source -> autonomous-grid-cli\dist\grid.exe.
        run: powershell -ExecutionPolicy Bypass -File scripts\cli\build_sidecar.ps1 -CliSrc "${{ github.workspace }}\autonomous-grid-cli"

      - name: Build Windows app + package zip
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: grid-app
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release
          powershell -ExecutionPolicy Bypass -File scripts\package_windows.ps1 `
            -Sidecar ..\autonomous-grid-cli\dist\grid.exe `
            -OutZip  "${{ github.workspace }}\grid-app\dist\Grid-${{ env.VERSION }}-Windows-x64.zip"

      # ───────────────────────── Publish ─────────────────────────
      # Cross-publish to the PUBLIC downloads repo (not this private one) so the
      # appcast + dmg are fetchable without auth. Needs GRID_DOWNLOADS_TOKEN — a
      # PAT with contents:write on DOWNLOADS_REPO (GITHUB_TOKEN only scopes to the
      # current repo). Draft: a human un-drafts to release it, which is also what
      # makes `releases/latest` (the feed URL) resolve to it.
      - name: Publish to downloads repo (draft)
        uses: softprops/action-gh-release@v3
        with:
          repository: ${{ env.DOWNLOADS_REPO }}
          token: ${{ secrets.GRID_DOWNLOADS_TOKEN }}
          draft: true
          name: Grid ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          # One glob per runner's dist/: mac -> .dmg + appcast.xml (Sparkle feed),
          # Windows -> .zip. Strict, without cross-platform misses.
          fail_on_unmatched_files: true
          files: grid-app/dist/*
