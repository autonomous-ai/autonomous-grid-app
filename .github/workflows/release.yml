name: release

# Tag-triggered release for the Grid desktop app (Flutter).
#
# Pushing a tag like `v0.1.2` builds the app on each target, bundles the `grid`
# CLI sidecar (Nuitka standalone/onedir, compiled from the grid CLI source by grid-app's
# own scripts/cli/build_sidecar.{sh,ps1}), and publishes a DRAFT GitHub Release:
#
#   Grid-<ver>-macOS-Apple-Silicon.dmg   (signed + notarized; arm64 grid sidecar)
#   Grid-<ver>-macOS-Intel.dmg           (signed + notarized; x86_64 grid sidecar, built under Rosetta 2)
#
# Both DMGs carry the same Flutter app — a Release build is universal (arm64 + x86_64),
# so it launches on either Mac. They differ only in the bundled `grid` sidecar's arch:
# Nuitka can't emit a universal binary, so we run one macOS job per sidecar arch (see the
# matrix below), and each job's sidecar is built for that job's target.
#
# macOS only for now — the Windows job is DISABLED (commented out in the matrix and
# in the steps below). It shipped `Grid-<ver>-Windows-x64.zip` unsigned, so SmartScreen
# warned on it, and with no WinSparkle feed those users never got an update. Its scripts
# (scripts/cli/build_sidecar.ps1, scripts/package_windows.ps1) and the Flutter `windows/`
# runner are untouched — uncomment to bring the job back once signing + a feed exist.
#
#   git tag v0.1.2 && git push origin v0.1.2
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   CLI_REPO_TOKEN              PAT with read access to autonomous-ai/autonomous-grid
#   APPLE_CERTIFICATE_BASE64    base64 of the "Developer ID Application" .p12
#   APPLE_CERTIFICATE_PASSWORD  password used when exporting that .p12
#   APPLE_SIGNING_IDENTITY      "Developer ID Application: <Name> (TEAMID)"
#   APPLE_ID                    Apple ID email          (notarization)
#   APPLE_TEAM_ID               Apple Developer Team ID (notarization)
#   APPLE_APP_PASSWORD          app-specific password   (notarization)
# GITHUB_TOKEN is provided automatically and needs `contents: write` (below).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# grid CLI release the sidecar is built from — always a published release, never `main`.
#   latest   -> newest published release, resolved at build time (drafts/prereleases skipped)
#   v0.3.10  -> that exact tag, frozen, for a fully reproducible build
# Pin whenever a release must ship a known-good CLI; `latest` trades that for not having
# to bump this line. Releases: https://github.com/autonomous-ai/autonomous-grid/releases
env:
  CLI_VERSION: latest
  CLI_REPO: autonomous-ai/autonomous-grid
  # PUBLIC repo that hosts client-facing release binaries (.dmg) + the Sparkle
  # appcast. Kept separate from this private source repo so the auto-update feed
  # is reachable without auth (a private repo's release assets 404 for anyone
  # without repo access — including the client's Sparkle). Must be a public repo
  # with at least one commit; CI cross-publishes to it with GRID_DOWNLOADS_TOKEN.
  DOWNLOADS_REPO: autonomous-ai/autonomous-grid-app-downloads

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # Apple Silicon, native arm64 app + sidecar
            arch: arm64
            label: macOS-Apple-Silicon
            appcast_file: appcast-arm64.xml    # Sparkle feed this arch's app polls
          - platform: macos-latest      # Intel x86_64 sidecar, compiled under Rosetta 2 on
            arch: x64                   # the same arm64 runner — GitHub retired the free
            label: macOS-Intel          # macos-13 Intel image, so this avoids a paid runner.
            appcast_file: appcast-x86_64.xml   # Sparkle feed this arch's app polls
          # Windows x64, native build — DISABLED, see the header. Uncomment this
          # entry together with the "Windows" steps below to build it again; the
          # steps are guarded by `runner.os == 'Windows'`, so they only wake up
          # when this entry is back.
          # - platform: windows-latest
          #   arch: x64
          #   label: Windows-x64

    runs-on: ${{ matrix.platform }}
    # The Nuitka sidecar build is slow (~45m, and 1.5-2x that for the Intel slice
    # compiling under Rosetta), with the notarization wait on top. 120m is safe —
    # it was raised from 60m, which timed a sidecar out mid-compile.
    timeout-minutes: 120

    steps:
      - name: Checkout app
        uses: actions/checkout@v5
        with:
          path: grid-app

      # Turn CLI_VERSION into a concrete tag: `latest` asks the CLI repo for its newest
      # published release, anything else is taken verbatim. Each matrix job resolves on
      # its own, so a release published mid-build could in theory split the three jobs
      # across two CLI tags — the summary line below records what each one actually
      # compiled, and pinning CLI_VERSION removes the window entirely.
      - name: Resolve grid CLI version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CLI_REPO_TOKEN }}
        run: |
          set -euo pipefail
          REF="${CLI_VERSION}"
          if [ "$REF" = "latest" ]; then
            REF="$(gh api "repos/${CLI_REPO}/releases/latest" --jq .tag_name)"
            [ -n "$REF" ] || { echo "no published release found in ${CLI_REPO}" >&2; exit 1; }
          fi
          echo "CLI_REF=$REF" >> "$GITHUB_ENV"
          echo "${{ matrix.label }}: grid CLI sidecar built from \`$REF\`" >> "$GITHUB_STEP_SUMMARY"

      # Sidecar source, pinned to the resolved CLI release (not main) for reproducible
      # builds. Cloned as a sibling of grid-app so the scripts' default CLI path
      # ("$APP_ROOT/../autonomous-grid") resolves unchanged.
      - name: Checkout grid CLI (sidecar source)
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CLI_REPO }}
          ref: ${{ env.CLI_REF }}
          token: ${{ secrets.CLI_REPO_TOKEN }}
          path: autonomous-grid

      - name: Resolve version
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          # Monotonic CFBundleVersion for Sparkle's "is there a newer build?"
          # comparison: 0.2.0 -> 2000, 0.3.0 -> 3000, 1.0.0 -> 1000000. Without a
          # per-release build number Flutter reuses the same CFBundleVersion and
          # Sparkle never offers the update.
          IFS=. read -r MA MI PA <<< "${V%%+*}"
          echo "BUILD=$((10#$MA * 1000000 + 10#$MI * 1000 + 10#$PA))" >> "$GITHUB_ENV"

      - name: Stamp version from tag
        shell: bash
        working-directory: grid-app
        run: scripts/build/set-version.sh "${VERSION}+${BUILD}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # PINNED, and it has to stay pinned. `channel: stable` alone builds
          # each tag with whatever stable happened to be current that day, so the
          # binary users get runs an engine nobody here has ever launched. That
          # is not hypothetical: Flutter 3.47.0 reached stable on 2026-08-12,
          # v0.3.41 was tagged on the 14th, and every release from then on
          # shipped a rendering engine (Dart 3.13.0) two minor versions ahead of
          # the 3.44.4 the team develops on — which is exactly when users started
          # reporting the UI tearing itself apart on both Intel and Apple
          # Silicon, while the same commit built locally was clean.
          #
          # So: this number is the version the fix was verified on. Moving it is
          # a deliberate act — bump it, run the app from a release build, and
          # look at it, in the same change.
          flutter-version: 3.44.4
          channel: stable
          cache: true

      # `architecture` pins the interpreter arch to the matrix arch: an arm64 python for
      # the Apple Silicon job, an x86_64 python (runs under Rosetta 2 on the arm64 runner)
      # for the Intel job. Nuitka can't cross-compile, so the sidecar's arch follows this
      # python — that's how the Intel slice is produced without a paid Intel runner.
      - name: Set up Python (sidecar build)
        id: setup_python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: ${{ matrix.arch }}

      - name: Flutter dependencies
        shell: bash
        working-directory: grid-app
        run: flutter pub get

      # ───────────────────────── macOS ─────────────────────────
      - name: Build grid sidecar (macOS)
        if: runner.os == 'macOS'
        working-directory: grid-app
        # grid-app's own driver compiles the cloned CLI source -> autonomous-grid/dist/grid.dist/
        # (Nuitka standalone/onedir). Nuitka can't cross-compile, so the sidecar's arch follows the
        # build python's arch: GRID_BUILD_PYTHON is the setup-python interpreter picked for this job
        # — arm64 for the Apple Silicon DMG, x86_64 (under Rosetta 2) for the Intel DMG. Onedir, not
        # onefile: the folder is signed (Developer ID, hardened runtime) + notarized downstream, so
        # nothing is extracted+SIGKILL'd at runtime under download quarantine.
        # TODO(release): the Intel job runs Nuitka under Rosetta (~1.5-2x slower) — watch the 120m
        # timeout on the first tagged Intel release and bump it if the compile gets close.
        env:
          GRID_BUILD_PYTHON: ${{ steps.setup_python.outputs.python-path }}
        run: |
          CLI="$GITHUB_WORKSPACE/autonomous-grid"
          if [ "${{ matrix.arch }}" = "x64" ]; then
            # The "x64" interpreter is universal2 and build_sidecar.sh's resolve_python()
            # realpath-collapses it to a framework python that macOS runs NATIVELY as arm64
            # — so a plain build emits an arm64 sidecar (proven by an earlier run and caught
            # by "Verify architecture"). Run the whole toolchain under Rosetta 2 so bash →
            # python → Nuitka's clang all target x86_64. Requires Rosetta on the runner; `arch`
            # errors loudly ("Bad CPU type") if a future macOS image has dropped it.
            arch -x86_64 bash scripts/cli/build_sidecar.sh "$CLI"
          else
            bash scripts/cli/build_sidecar.sh "$CLI"
          fi

      - name: Build macOS app + inject sidecar
        if: runner.os == 'macOS'
        working-directory: grid-app
        run: |
          set -euxo pipefail
          flutter config --enable-macos-desktop
          # Bake the Sparkle appcast feed the app polls at runtime. The app ships
          # ONE universal binary that runs on either Mac, so both jobs bake the
          # SAME `{arch}` template — the app resolves it to appcast-arm64.xml or
          # appcast-x86_64.xml from the live CPU (resolveAppcastArch), keeping an
          # Intel Mac off the arm64 DMG (whose sidecar can't run there) and vice
          # versa. Stable public URL on the downloads repo: GitHub always serves
          # the newest *published* (non-draft) release's asset by this name.
          flutter build macos --release \
            --dart-define=GRID_APPCAST_URL="https://github.com/${{ env.DOWNLOADS_REPO }}/releases/latest/download/appcast-{arch}.xml"
          APP="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n1)"
          [ -n "$APP" ] || { echo "built .app not found" >&2; exit 1; }
          # onedir sidecar: inject the whole standalone folder (entry at Resources/grid/grid)
          rm -rf "$APP/Contents/Resources/grid"
          cp -R ../autonomous-grid/dist/grid.dist "$APP/Contents/Resources/grid"
          chmod +x "$APP/Contents/Resources/grid/grid"

      # Fail loudly HERE — before the slow sign+notarize — if anything in the bundle is
      # missing this job's target arch. Guards two real risks that would otherwise build
      # clean on the arm64 runner and only surface on a user's Mac:
      #   • a sidecar compiled for the wrong arch (Nuitka follows the build python's arch),
      #   • a prebuilt plugin framework (e.g. media_kit's mpv) with no x86_64 slice, which
      #     builds fine here yet crashes on a real Intel Mac.
      # Invariant checked: every Mach-O in the .app must contain EXPECT. Universal binaries
      # carry both arches (pass); the single-arch onedir sidecar carries EXPECT (pass).
      - name: Verify architecture (macOS)
        if: runner.os == 'macOS'
        working-directory: grid-app
        run: |
          set -euo pipefail
          case "${{ matrix.arch }}" in
            arm64) EXPECT=arm64 ;;
            x64)   EXPECT=x86_64 ;;
            *) echo "unknown matrix.arch '${{ matrix.arch }}'" >&2; exit 1 ;;
          esac
          APP="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n1)"
          [ -n "$APP" ] || { echo "built .app not found" >&2; exit 1; }
          echo ">>> Every Mach-O in $(basename "$APP") must contain: $EXPECT"

          has_arch() { lipo -archs "$1" 2>/dev/null | tr ' ' '\n' | grep -qx "$EXPECT"; }

          # Sidecar entry must be exactly this job's target arch (Nuitka is single-arch).
          sidecar="$APP/Contents/Resources/grid/grid"
          echo "sidecar grid: $(lipo -archs "$sidecar")"
          has_arch "$sidecar" || { echo "ERROR: sidecar is not $EXPECT" >&2; exit 1; }

          # Scan every Mach-O in the bundle; collect any that lack EXPECT.
          missing=0
          while IFS= read -r -d '' f; do
            file -b "$f" | grep -q 'Mach-O' || continue
            has_arch "$f" || { echo "MISSING $EXPECT: $f ($(lipo -archs "$f" 2>/dev/null))" >&2; missing=$((missing+1)); }
          done < <(find "$APP" -type f -print0)
          [ "$missing" -eq 0 ] || { echo "ERROR: $missing Mach-O file(s) lack the $EXPECT slice" >&2; exit 1; }
          echo ">>> OK: all Mach-O binaries contain $EXPECT"

      - name: Set up signing + notarization
        if: runner.os == 'macOS'
        working-directory: grid-app
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          NOTARY_PROFILE: grid-notary
        run: scripts/ci/setup_macos_signing.sh

      # Reuses scripts/notarize_macos.sh: signs the sidecar + app with the
      # Developer ID (hardened runtime), notarizes + staples, builds the .dmg
      # via package_dmg_macos.sh, then notarizes + staples the dmg too.
      - name: Sign, notarize, package DMG
        if: runner.os == 'macOS'
        working-directory: grid-app
        env:
          DEV_ID: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_PROFILE: grid-notary
          OUT_DMG: ${{ github.workspace }}/grid-app/dist/Grid-${{ env.VERSION }}-${{ matrix.label }}.dmg
        run: |
          mkdir -p dist
          scripts/notarize_macos.sh

      # Sign the DMG with the Sparkle EdDSA key and write this arch's appcast next
      # to it (both get uploaded by the publish step). Skipped with a warning
      # until the SPARKLE_ED_PRIVATE_KEY secret is provisioned, so releases still
      # build.
      #
      # BOTH macOS jobs emit an appcast now, each under its own arch name
      # (appcast-arm64.xml / appcast-x86_64.xml) pointing at its own DMG — the
      # universal app resolves the `{arch}` feed URL for the CPU it's on, so Apple
      # Silicon and Intel each track their matching DMG (an arm64 sidecar can't run
      # on Intel at all). Distinct names, so the two jobs never clobber each
      # other's feed. The Intel job also writes a legacy `appcast.xml` alias (next
      # step) for any pre-`{arch}` build still polling that fixed name.
      - name: Generate Sparkle appcast (macOS)
        if: runner.os == 'macOS'
        working-directory: grid-app
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          DMG: ${{ github.workspace }}/grid-app/dist/Grid-${{ env.VERSION }}-${{ matrix.label }}.dmg
          DOWNLOAD_URL: https://github.com/${{ env.DOWNLOADS_REPO }}/releases/download/${{ github.ref_name }}/Grid-${{ env.VERSION }}-${{ matrix.label }}.dmg
          SHORT_VERSION: ${{ env.VERSION }}
          BUNDLE_VERSION: ${{ env.BUILD }}
          APPCAST_OUT: ${{ github.workspace }}/grid-app/dist/${{ matrix.appcast_file }}
        run: bash scripts/ci/generate_appcast_macos.sh

      # Backward-compat bridge: an app built before the `{arch}` template bakes the
      # fixed URL `.../appcast.xml`. Serve that name from the Intel (x86_64) feed —
      # the slice that runs on BOTH Macs (native on Intel, Rosetta on Apple
      # Silicon) — so an older install of either arch still gets a working update
      # that migrates it onto an arch-aware build. Guarded on the file existing, so
      # it no-ops when the appcast step was skipped (no Sparkle key yet).
      - name: Alias legacy appcast.xml (macOS Intel)
        if: matrix.label == 'macOS-Intel'
        working-directory: grid-app
        run: |
          src="dist/${{ matrix.appcast_file }}"
          [ -f "$src" ] && cp "$src" dist/appcast.xml || echo "no appcast to alias (key unset)"

      # ──────────────────── Windows (DISABLED) ────────────────────
      # Kept verbatim, not deleted: nothing here is broken — the release just
      # doesn't ship Windows yet. Uncomment these two steps and the matrix entry
      # above, in one go, to build it again.
      # - name: Build grid sidecar (Windows)
      #   if: runner.os == 'Windows'
      #   working-directory: grid-app
      #   # grid-app's own driver compiles the cloned CLI source -> autonomous-grid\dist\grid.exe.
      #   run: powershell -ExecutionPolicy Bypass -File scripts\cli\build_sidecar.ps1 -CliSrc "${{ github.workspace }}\autonomous-grid"
      #
      # - name: Build Windows app + package zip
      #   if: runner.os == 'Windows'
      #   shell: pwsh
      #   working-directory: grid-app
      #   run: |
      #     flutter config --enable-windows-desktop
      #     flutter build windows --release
      #     powershell -ExecutionPolicy Bypass -File scripts\package_windows.ps1 `
      #       -Sidecar ..\autonomous-grid\dist\grid.exe `
      #       -OutZip  "${{ github.workspace }}\grid-app\dist\Grid-${{ env.VERSION }}-Windows-x64.zip"

      # ───────────────────────── Publish ─────────────────────────
      # Cross-publish to the PUBLIC downloads repo (not this private one) so the
      # appcast + dmg are fetchable without auth. Needs GRID_DOWNLOADS_TOKEN — a
      # PAT with contents:write on DOWNLOADS_REPO (GITHUB_TOKEN only scopes to the
      # current repo). Draft: a human un-drafts to release it, which is also what
      # makes `releases/latest` (the feed URL) resolve to it.
      - name: Publish to downloads repo (draft)
        uses: softprops/action-gh-release@v3
        with:
          repository: ${{ env.DOWNLOADS_REPO }}
          token: ${{ secrets.GRID_DOWNLOADS_TOKEN }}
          draft: true
          name: Grid ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          # Whatever this runner's dist/ holds — the .dmg plus the appcast.xml
          # (Sparkle feed) beside it. Strict: an empty dist/ fails the job rather
          # than publishing a draft with a slice missing.
          fail_on_unmatched_files: true
          files: grid-app/dist/*
