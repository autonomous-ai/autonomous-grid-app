# Managed component dependencies (pulled by the IDF Component Manager on build).
#
# Versions are the ones the reference firmware resolved and ships on this exact board — see
# dependencies.lock, which is committed so a fresh clone builds against the same set rather than against
# whatever the registry offers today.
dependencies:
  idf:
    version: ">=5.5.0"

  # LVGL v9 graphics library.
  lvgl/lvgl: "^9.2.0"

  # --- Panel: ST7701 over 16-bit RGB parallel ---
  # Pulled for its init-command struct and timing macros. ui/display.c does NOT use the driver's own
  # esp_lcd_new_panel_st7701() entry point: that programs the ST7701's registers BEFORE the RGB
  # peripheral is running, and on this panel the part then accepts every write and scans nothing. See the
  # ORDER note in display.c.
  espressif/esp_lcd_st7701: "*"

  # The ST7701's registers are NOT on the 16 data lines. They travel over a 3-wire SPI that this
  # component bit-bangs — here, entirely on IO-expander pins (see main/board/io_expander.c).
  espressif/esp_lcd_panel_io_additions: "^1"

  # TCA9554 IO expander: the panel's 3-wire SPI (CS/SDA/SCL), the panel reset, and the speaker amp.
  # Its API takes BITMASKS, not pin indices — see the warning in board/board_pins.h, which is there
  # because getting it wrong returns ESP_OK while driving the wrong pin.
  espressif/esp_io_expander_tca9554: "^2"

  # GT911 capacitive touch → LVGL pointer indev. Pulls esp_lcd_touch.
  # This board leaves BOTH the GT911 INT and RST unconnected, so the driver runs POLLED (int = NC).
  espressif/esp_lcd_touch_gt911: "^1"
