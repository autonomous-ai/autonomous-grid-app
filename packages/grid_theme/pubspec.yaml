name: grid_theme
description: >-
  Grid's design system: the palette, the surfaces, the type ramp, the control
  sizes and the motion curve — every token both Grid on a computer and Grid on a
  phone resolve against.
version: 0.1.0
publish_to: 'none'

# Flutter, but no plugins — that is what makes it shareable.
#
# The desktop app cannot itself be the shared copy: it depends on
# window_manager, tray_manager, auto_updater and desktop_drop, none of which
# build for iOS. The same reason `grid_pairing` exists.
#
# The alternative was retyping the hexes into the phone app, and
# `docs/style-guide-grid-app.md` says why that is worse than it looks: the
# palette is not a list of colours, it is a set of *decisions* — `accent` is
# separate from `accentOnSurface` because merging them drops white button text
# to 3.1:1. A second copy keeps the hexes and loses the reasons, and then one of
# them gets "fixed".
environment:
  sdk: ^3.10.0
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  # Only so the repo-root analysis_options.yaml resolves when this package is
  # analysed on its own. Same rules as the app, no second opinion about style.
  flutter_lints: ^6.0.0
