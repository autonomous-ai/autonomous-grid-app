name: grid_app
description: "A new Flutter project."
publish_to: 'none'
# The +N build number becomes CFBundleVersion, which Sparkle compares to the
# appcast's <sparkle:version>. It must be a monotonically increasing integer —
# a dotted "0.2.0" broke that for local builds. CI overrides this with the real
# build via set-version.sh "<tag>+<build>" (see .github/workflows/release.yml).
version: 0.2.0+1

environment:
  # Raised from ^3.9.2 by flutter_local_notifications, which needs ^3.10.0. The
  # floor was already effectively this — declaring it makes a too-old SDK fail
  # with the reason rather than with a resolver riddle.
  sdk: ^3.10.0

dependencies:
  archive: ^4.0.7
  auto_updater: ^1.0.0
  cached_network_image: ^3.4.1
  crypto: ^3.0.6
  cryptography: ^2.9.0
  desktop_drop: ^0.7.1
  # Generates the blank document "New" makes. Reading and drawing a .docx is the
  # app's own (office/logic/docx_edit.dart + docx_format.dart) — a read-only
  # renderer from `docx_file_viewer` was tried and dropped: it lost the text of
  # list items built from soft breaks.
  docx_creator: ^1.3.2
  file_selector: ^1.0.3
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.2.0
  flutter_markdown_plus: ^1.0.12
  flutter_pty: ^0.4.2
  flutter_riverpod: ^3.3.2
  flutter_svg: ^2.3.0
  lucide_icons_flutter: ^3.1.15
  markdown: ^7.3.1
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  package_info_plus: ^10.2.0
  pasteboard: ^0.5.0
  re_highlight: ^0.0.3
  record: ^7.1.1
  toml: ^0.18.0
  tray_manager: ^0.5.3
  url_launcher: ^6.3.2
  window_manager: ^0.5.1
  xml: ^7.0.1
  xterm: ^4.0.0
  yaml_edit: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Vendored fork of tray_manager: its upstream macOS menu can't render per-item
# icons, so packages/tray_manager patches TrayMenu.swift to draw tinted SF
# Symbol icons (blue = active grid, grey = others) in the menu-bar menu.
dependency_overrides:
  # docx_creator still declares `xml: ^6.6.1`, and this app is on 7: its own OOXML
  # code needs two things 6 doesn't have — `namespaceUri:` on `findAllElements`,
  # and `XmlName.parts` — so `ooxml_text.dart` and `docx_edit.dart` would both
  # have to be walked back to use it.
  #
  # The override is the smaller move, and it is checked rather than assumed:
  # `dart run tool/docx_roundtrip_check.dart` generates a blank document through
  # that package under xml 7 and then opens and patches it. Drop this line when
  # docx_creator widens its constraint — and re-run that probe when either
  # package moves.
  xml: ^7.0.1
  tray_manager:
    path: packages/tray_manager

flutter:
  uses-material-design: true
  assets:
    - assets/tray/tray_icon.png
    - assets/brand/grid_logo_bg.png
    # Agent marks, bundled rather than fetched from the CDN they came from: the
    # Agents screen makes no network calls at all, and an icon that arrives late
    # would pop into a row that has already been laid out.
    - assets/agents/hermes_icon.webp
    - assets/agents/codex_icon.png
    - assets/agents/claude_icon.png
    # A panel's firmware, so the app can reflash it over the cable it is already
    # talking on and the two halves cannot drift. The DIRECTORY form is
    # deliberate and load-bearing: it ships with no image in it today, and a
    # declared asset FILE that does not exist fails the Flutter build outright.
    # See assets/panel/README.md.
    - assets/panel/
    # Connectors the app signs into without the gateway. Data rather than Dart
    # so the list reads as the wire shape it mirrors — and so adding one is an
    # edit to a file, not to a compiled const.
