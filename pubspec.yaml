name: grid_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.2.0

environment:
  sdk: ^3.9.2

dependencies:
  auto_updater: ^1.0.0
  cached_network_image: ^3.4.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  gpt_markdown: ^1.1.7
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  package_info_plus: ^10.2.0
  toml: ^0.18.0
  tray_manager: ^0.5.3
  url_launcher: ^6.3.2
  window_manager: ^0.5.1
  yaml_edit: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# Vendored fork of tray_manager: its upstream macOS menu can't render per-item
# icons, so packages/tray_manager patches TrayMenu.swift to draw tinted SF
# Symbol icons (blue = active grid, grey = others) in the menu-bar menu.
dependency_overrides:
  tray_manager:
    path: packages/tray_manager

flutter:
  uses-material-design: true
  assets:
    - assets/tray/tray_icon.png
    - assets/brand/grid_logo_bg.png
